name: Verify deployed B2 service
on:
  workflow_dispatch:
  push:
    branches: [noix-delf-b2-mac]
    paths: ['scripts/check-cloud.mjs', '.github/workflows/check-cloud.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify after the deployment becomes ready
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-cloud.mjs; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
