name: Verify deployed B2 service
on:
  workflow_dispatch:
  push:
    branches: [noix-delf-b2-mac]
    paths: ['scripts/check-cloud.mjs', '.github/workflows/check-cloud.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-cloud.mjs
