name: Build offline study website
on:
  push:
    branches: [noix-dalf-c1]
    paths: ['src/**', 'public/**', 'scripts/package*.py', 'package*.json', '.github/workflows/offline-release.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python3 scripts/package_offline.py
      - name: Update downloadable offline archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/noix-dalf-c1-offline.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh complete offline study website'
            git push
          fi
