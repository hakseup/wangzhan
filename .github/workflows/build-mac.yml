name: Build unsigned Mac app
on:
  workflow_dispatch:
  push:
    branches: [noix-delf-b2-mac]
    paths: ['desktop/**', '.github/workflows/build-mac.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Configure deployed application
        run: node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("desktop/service.json"));const u=new URL(c.url);if(u.protocol!=="https:")throw Error("HTTPS required");fs.writeFileSync("desktop/app-config.json",JSON.stringify(c))'
      - run: npm ci --prefix desktop
      - name: Build unsigned Intel and Apple Silicon installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Noix-B2-Mac-installers-unsigned
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
