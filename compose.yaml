services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - learning:/app/data/runtime
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      - app
volumes:
  learning:
  certificates:
